name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: enable auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The body of a squash commit is the description of its pull request, which Dependabot fills with release notes in its own style. The merge replaces it with this text, and the release notes stay on the pull request.
      - name: Merge once every required check passes
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST_URL: ${{ github.event.pull_request.html_url }}
          # The lines stay within the length that commitlint allows in a body, which scripts/dependabot-commit-body.test.ts checks.
          COMMIT_BODY: |-
            Dependabot updates the dependencies that the title names. The check job and the review
            panel passed the update, and the pull request holds the release notes.
        run: gh pr merge --auto --squash --body "$COMMIT_BODY" "$PULL_REQUEST_URL"
