name: Dependabot auto-merge

# The check of titles runs on the same events, so the merge takes the subject of every title that the check judged.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# A push and a new title of Dependabot start two runs, and each reads the title of its own event. Only the latest run may set the subject, as only the latest run of the check judges the title.
concurrency:
  group: dependabot-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: enable auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        timeout-minutes: 4
        with:
          install: false
      # A squash commit takes the title and the description of its pull request, which Dependabot writes in its own style, with release notes in the description. The merge gives the commit the subject that the check of titles read and this body, and the release notes stay on the pull request. Each push of Dependabot can change the title, so the merge is set again for every push.
      - name: Merge once every required check passes
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST_URL: ${{ github.event.pull_request.html_url }}
          TITLE: ${{ github.event.pull_request.title }}
          # The lines stay within the length that commitlint allows in a body, which scripts/dependabot-commit-body.test.ts checks.
          COMMIT_BODY: |-
            Dependabot updates the dependencies that the title names. The check job and the review
            panel passed the update, and the pull request holds the release notes.
        run: |
          subject=$(node scripts/print-dependabot-subject.ts)
          enabled=$(gh pr view "$PULL_REQUEST_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ "$enabled" = "true" ]; then
            gh pr merge --disable-auto "$PULL_REQUEST_URL"
          fi
          gh pr merge --auto --squash --subject "$subject" --body "$COMMIT_BODY" "$PULL_REQUEST_URL"
