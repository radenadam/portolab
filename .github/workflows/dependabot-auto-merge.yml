name: Dependabot auto-merge

# The check of titles runs on the same events, so the title that this job writes is the subject that the check judged.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# A push and a new title of Dependabot start two runs, and each reads the title of its own event. Only the latest run may write the title, as only the latest run of the check judges it.
concurrency:
  group: dependabot-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: enable auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        timeout-minutes: 4
        with:
          install: false
      # A squash commit takes the title that its pull request has when it merges, and here this body instead of the description, which Dependabot fills with release notes in its own style. So the job writes each title of Dependabot in the style of the history, as the check of titles reads it, and sets the merge once. GitHub refuses a workflow that disables a merge which another account set, so the job never resets it, and an edit by this job starts no other run.
      - name: Merge once every required check passes
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST_URL: ${{ github.event.pull_request.html_url }}
          TITLE: ${{ github.event.pull_request.title }}
          # The lines stay within the length that commitlint allows in a body, which scripts/dependabot-commit-body.test.ts checks.
          COMMIT_BODY: |-
            Dependabot updates the dependencies that the title names. The check job and the review
            panel passed the update, and the pull request holds the release notes.
        run: |
          subject=$(node scripts/print-dependabot-subject.ts)
          if [ "$subject" != "$TITLE" ]; then
            gh pr edit "$PULL_REQUEST_URL" --title "$subject"
          fi
          enabled=$(gh pr view "$PULL_REQUEST_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ "$enabled" != "true" ]; then
            gh pr merge --auto --squash --body "$COMMIT_BODY" "$PULL_REQUEST_URL"
          fi
