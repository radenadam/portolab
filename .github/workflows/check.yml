name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BROWSER_SHARDS: "8"

jobs:
  fast:
    name: fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - &setup
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        timeout-minutes: 10
        with:
          cache: true
          require-lockfile: true
      # Dependabot writes "Bump" with a capital, so for its pull requests the check reads the title that the job of its merge writes, which the squash commit takes as its subject.
      - name: Check the pull request title
        timeout-minutes: 2
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          subject="$TITLE"
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            subject=$(node scripts/print-dependabot-subject.ts)
          fi
          printf '%s\n' "$subject" | pnpm exec commitlint
      - name: Run the fast check
        timeout-minutes: 15
        run: pnpm check:fast

  browser-1:
    name: browser-1
    runs-on: ubuntu-latest
    timeout-minutes: &browser-job-timeout 35
    env:
      SHARD_INDEX: "1"
    steps: &browser-steps
      - *checkout
      - *setup
      - name: Install the browser for end-to-end tests
        uses: ./.github/actions/install-browser
        timeout-minutes: 10
      - name: Build the app for browser tests
        timeout-minutes: 5
        run: pnpm build
      # Decision 0051 sizes the shards from complete runs. The step leaves time for reports after a stalled shard.
      - name: Run the browser shard
        timeout-minutes: 20
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: pnpm test:e2e --shard="$SHARD_INDEX/$BROWSER_SHARDS" --reporter=github,list,html
      - name: Upload the failed shard's traces and report
        timeout-minutes: 5
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.job }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  browser-2:
    name: browser-2
    runs-on: ubuntu-latest
    timeout-minutes: *browser-job-timeout
    env:
      SHARD_INDEX: "2"
    steps: *browser-steps

  browser-3:
    name: browser-3
    runs-on: ubuntu-latest
    timeout-minutes: *browser-job-timeout
    env:
      SHARD_INDEX: "3"
    steps: *browser-steps

  browser-4:
    name: browser-4
    runs-on: ubuntu-latest
    timeout-minutes: *browser-job-timeout
    env:
      SHARD_INDEX: "4"
    steps: *browser-steps

  browser-5:
    name: browser-5
    runs-on: ubuntu-latest
    timeout-minutes: *browser-job-timeout
    env:
      SHARD_INDEX: "5"
    steps: *browser-steps

  browser-6:
    name: browser-6
    runs-on: ubuntu-latest
    timeout-minutes: *browser-job-timeout
    env:
      SHARD_INDEX: "6"
    steps: *browser-steps

  browser-7:
    name: browser-7
    runs-on: ubuntu-latest
    timeout-minutes: *browser-job-timeout
    env:
      SHARD_INDEX: "7"
    steps: *browser-steps

  browser-8:
    name: browser-8
    runs-on: ubuntu-latest
    timeout-minutes: *browser-job-timeout
    env:
      SHARD_INDEX: "8"
    steps: *browser-steps

  check:
    name: check
    if: ${{ always() }}
    needs:
      [
        fast,
        browser-1,
        browser-2,
        browser-3,
        browser-4,
        browser-5,
        browser-6,
        browser-7,
        browser-8,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *checkout
      - name: Require every check job to succeed
        timeout-minutes: 2
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/check-job-results.ts
