name: Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

# The agents run in a job whose token can only read, because a diff can carry instructions for them. The review job runs no agent and writes the review. Each agent writes its answer to a file only when it finished, and the review job judges in code which files the plan needed, which no agent can skip. scripts/review-plan.ts caps the rounds, and at the cap the plan runs no agent and the review fails with the next step. AGENTS.md describes the panel.
jobs:
  agents:
    name: agents
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      reviewer-run: ${{ steps.reviewer-run.outputs.sentence }}
      verifier-run: ${{ steps.verifier-run.outputs.sentence }}
    steps:
      # The head of the pull request itself, not its merge with the base branch, is what the state of the panel records and what the agents are told is checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        timeout-minutes: 10
        with:
          cache: true
          require-lockfile: true
      - name: Plan the round
        timeout-minutes: 5
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/plan-review.ts >> "$GITHUB_OUTPUT"
      - name: Install the browser for the product lens
        if: steps.plan.outputs.product == 'true'
        uses: ./.github/actions/install-browser
        # The step ends long before the job does, so a stalled download fails here by name.
        timeout-minutes: 10
      # Each value is assigned on its own line, because a failure inside a command substitution within echo would not fail the step. The inputs are independent, so every script runs before the step stops, and the log names every failure.
      - name: Read the schemas of the answers and the tools of the verifier
        timeout-minutes: 2
        id: definitions
        if: steps.plan.outputs.kind == 'review' || steps.plan.outputs.kind == 'check'
        run: |
          failed=0
          findings=$(node scripts/print-schema.ts .github/review/findings.schema.json) || failed=1
          verdicts=$(node scripts/print-schema.ts .github/review/verdicts.schema.json) || failed=1
          tools=$(node scripts/read-agent-tools.ts .claude/agents/review-verifier.md) || failed=1
          if [ "$failed" -ne 0 ]; then exit 1; fi
          echo "findings=${findings}" >> "$GITHUB_OUTPUT"
          echo "verdicts=${verdicts}" >> "$GITHUB_OUTPUT"
          echo "tools=${tools}" >> "$GITHUB_OUTPUT"
      - name: Review the change
        timeout-minutes: 40
        id: reviewer
        if: steps.plan.outputs.kind == 'review'
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "dependabot[bot]"
          prompt: |
            You review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }} for the review panel that the section "Review panel" of AGENTS.md describes. The head of the pull request is checked out, and its dependencies are installed.

            `review/files.txt` lists the files under review, one on each line. ${{ steps.plan.outputs.scope }}

            Apply each of these lenses: ${{ steps.plan.outputs.lenses }}. The file `.claude/agents/review-<lens>.md` defines each lens. Playwright's Chromium is installed when the product lens is among them.

            Return the structured output. Each finding names its lens and its scope, which the section "Review panel" of AGENTS.md defines. `readFiles` names each file under review whose diff you read, and `lensChecks` says for each lens what you checked through it. The review fails when a file under review or a lens is missing from them. When there is nothing to report, the lists of findings and candidate standards are empty.
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "${{ steps.plan.outputs.tools }}"
            --json-schema '${{ steps.definitions.outputs.findings }}'
      - name: Save the findings for the verifier
        timeout-minutes: 2
        id: findings
        if: steps.plan.outputs.kind == 'review' || steps.plan.outputs.kind == 'check'
        env:
          REVIEWER_OUTPUT: ${{ steps.reviewer.outputs.structured_output }}
        run: node scripts/save-findings.ts >> "$GITHUB_OUTPUT"
      - name: Verify the findings
        timeout-minutes: 25
        id: verifier
        if: steps.findings.outputs.total != '' && steps.findings.outputs.total != '0'
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "dependabot[bot]"
          prompt: |
            You verify the findings of the review panel for pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}. The file `.claude/agents/review-verifier.md` defines your task. `review/findings.json` holds the findings, each with an id. The number before the dot of an id is the round that reported the finding, and this is round ${{ steps.plan.outputs.round }}. The head of the pull request is checked out, and `git diff origin/${{ github.base_ref }}...HEAD` shows the whole change.

            Return exactly one verdict for each finding in the structured output, under the finding's id, with its status, its scope, all of its siblings, and the evidence you checked. `duplicateOf` holds the id of the confirmed finding that a duplicate repeats, and it is empty for any other status.
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "${{ steps.definitions.outputs.tools }}"
            --json-schema '${{ steps.definitions.outputs.verdicts }}'
      - name: Save the verdicts
        timeout-minutes: 2
        id: verdicts
        if: steps.findings.outputs.total != '' && steps.findings.outputs.total != '0'
        env:
          VERIFIER_OUTPUT: ${{ steps.verifier.outputs.structured_output }}
        run: node scripts/save-verdicts.ts
      # Each measure is assigned on its own line, because a failure inside a command substitution within echo would not fail the step.
      - name: Measure the reviewer
        timeout-minutes: 2
        id: reviewer-run
        if: always() && steps.reviewer.outputs.execution_file != ''
        env:
          TRANSCRIPT: ${{ steps.reviewer.outputs.execution_file }}
        run: |
          sentence=$(node scripts/describe-agent-run.ts reviewer "$TRANSCRIPT")
          echo "sentence=${sentence}" >> "$GITHUB_OUTPUT"
      - name: Measure the verifier
        timeout-minutes: 2
        id: verifier-run
        if: always() && steps.verifier.outputs.execution_file != ''
        env:
          TRANSCRIPT: ${{ steps.verifier.outputs.execution_file }}
        run: |
          sentence=$(node scripts/describe-agent-run.ts verifier "$TRANSCRIPT")
          echo "sentence=${sentence}" >> "$GITHUB_OUTPUT"
      # The review job judges whatever the steps wrote, so the folder goes on after any failure. It stays for one day, because a public repository's artifacts are public.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        if: always()
        with:
          name: review
          path: review
          retention-days: 1
          overwrite: true
      # An agent that failed, ran out of time, or gave an answer that could not be read is traced through its transcript. It stays for one day, because a public repository's artifacts are public.
      - name: Keep the transcript of a reviewer without an answer
        timeout-minutes: 5
        if: always() && steps.reviewer.outputs.execution_file != '' && (steps.reviewer.outcome != 'success' || steps.findings.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transcript-reviewer
          path: ${{ steps.reviewer.outputs.execution_file }}
          retention-days: 1
          overwrite: true
      - name: Keep the transcript of a verifier without an answer
        timeout-minutes: 5
        if: always() && steps.verifier.outputs.execution_file != '' && (steps.verifier.outcome != 'success' || steps.verdicts.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transcript-verifier
          path: ${{ steps.verifier.outputs.execution_file }}
          retention-days: 1
          overwrite: true

  review:
    name: review
    needs: agents
    # GitHub counts a skipped required check as passed, so this job always runs. When a newer push superseded the run, it fails without posting a review, and otherwise it names every input that is missing.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        timeout-minutes: 4
        with:
          install: false
      # A job of the agents that ended early uploads no folder, and the next step reports what is missing, so a missing artifact is not an error here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 3
        continue-on-error: true
        with:
          name: review
          path: review
      - name: Post the review and give the verdict
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          REVIEWED_HEAD: ${{ github.event.pull_request.head.sha }}
          AGENTS_RESULT: ${{ needs.agents.result }}
          REVIEWER_RUN: ${{ needs.agents.outputs.reviewer-run }}
          VERIFIER_RUN: ${{ needs.agents.outputs.verifier-run }}
        run: node scripts/post-review.ts
