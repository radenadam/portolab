name: Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

# Each lens runs as its own job with a fresh agent, so a lens either reports its findings or fails its job. The review job then decides the verdict in code. AGENTS.md describes the panel.
jobs:
  route:
    name: route
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      lenses: ${{ steps.lenses.outputs.lenses }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Choose the lenses
        id: router
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "dependabot[bot]"
          prompt: |
            You are the router of the review panel for pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}. The head of the pull request is checked out, and `git diff origin/${{ github.base_ref }}...HEAD` shows the change. The section "Review panel" in AGENTS.md defines your role. Each file `.claude/agents/review-*.md` defines one lens, and its description says which changes the lens applies to.

            Return the structured output. `lenses` lists every lens that applies to the change, by the part of its file name after `review-`, and also every lens you are unsure about.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Read,Grep,Glob,Bash"
            --json-schema '{"type":"object","properties":{"lenses":{"type":"array","items":{"type":"string","enum":["standards","consistency","craft","architecture","product","docs","reliability"]}}},"required":["lenses"]}'
      - name: Add the lenses that review every change
        id: lenses
        env:
          ROUTER_OUTPUT: ${{ steps.router.outputs.structured_output }}
        run: |
          lenses=$(printf '%s' "$ROUTER_OUTPUT" | jq -c '(.lenses + ["standards", "consistency"]) | unique')
          echo "lenses=${lenses}" >> "$GITHUB_OUTPUT"
      # A failed agent is traced through its transcript. It stays for one day, because a public repository's artifacts are public.
      - name: Keep the transcript of a failed router
        if: failure() && steps.router.outputs.execution_file != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transcript-route
          path: ${{ steps.router.outputs.execution_file }}
          retention-days: 1

  lens:
    name: lens (${{ matrix.lens }})
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lens: ${{ fromJSON(needs.route.outputs.lenses) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - name: Install the browser for the product lens
        if: matrix.lens == 'product'
        run: pnpm exec playwright install --with-deps chromium
      - name: Review through the lens
        id: lens
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "dependabot[bot]"
          prompt: |
            You review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }} through one lens of the review panel that AGENTS.md describes. The file `.claude/agents/review-${{ matrix.lens }}.md` defines the lens, so read it and follow it. The head of the pull request is checked out, and `git diff origin/${{ github.base_ref }}...HEAD` shows the change. Dependencies are installed, and Playwright's Chromium is installed for the product lens.

            Return the findings and the candidate standards as the structured output. When there is nothing to report, both lists are empty.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Read,Grep,Glob,Write,Bash"
            --json-schema '{"type":"object","properties":{"findings":{"type":"array","items":{"type":"object","properties":{"location":{"type":"string"},"claim":{"type":"string"},"basis":{"type":"string"},"siblings":{"type":"array","items":{"type":"string"}},"rootCause":{"type":"string"}},"required":["location","claim","basis","siblings","rootCause"]}},"candidateStandards":{"type":"array","items":{"type":"object","properties":{"standard":{"type":"string"},"incident":{"type":"string"}},"required":["standard","incident"]}}},"required":["findings","candidateStandards"]}'
      - name: Save the findings of the lens
        env:
          LENS: ${{ matrix.lens }}
          LENS_OUTPUT: ${{ steps.lens.outputs.structured_output }}
        run: |
          printf '%s' "$LENS_OUTPUT" | jq --arg lens "$LENS" '{lens: $lens, findings: (.findings | map(. + {lens: $lens})), candidateStandards}' > "findings-${LENS}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ matrix.lens }}
          path: findings-${{ matrix.lens }}.json
          retention-days: 1
      - name: Keep the transcript of a failed lens
        if: failure() && steps.lens.outputs.execution_file != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transcript-lens-${{ matrix.lens }}
          path: ${{ steps.lens.outputs.execution_file }}
          retention-days: 1

  verify:
    name: verify
    needs: lens
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: findings-*
          path: findings
          merge-multiple: true
      - name: Count the findings
        id: count
        run: echo "total=$(jq -s '[.[].findings[]] | length' findings/*.json)" >> "$GITHUB_OUTPUT"
      - name: Verify the findings
        id: verifier
        if: steps.count.outputs.total != '0'
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "dependabot[bot]"
          prompt: |
            You verify the findings of the review panel for pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}. The file `.claude/agents/review-verifier.md` defines your task, so read it and follow it. The findings are in `findings/`, one JSON file for each lens. The head of the pull request is checked out, and `git diff origin/${{ github.base_ref }}...HEAD` shows the change.

            Return every finding in the structured output, with its status and the evidence you checked.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Read,Grep,Glob,Write,Bash"
            --json-schema '{"type":"object","properties":{"findings":{"type":"array","items":{"type":"object","properties":{"lens":{"type":"string"},"location":{"type":"string"},"claim":{"type":"string"},"basis":{"type":"string"},"siblings":{"type":"array","items":{"type":"string"}},"rootCause":{"type":"string"},"status":{"type":"string","enum":["confirmed","refuted"]},"evidence":{"type":"string"}},"required":["lens","location","claim","basis","siblings","rootCause","status","evidence"]}}},"required":["findings"]}'
      - name: Save the verified findings
        env:
          TOTAL: ${{ steps.count.outputs.total }}
          VERIFIER_OUTPUT: ${{ steps.verifier.outputs.structured_output }}
        run: |
          if [ "$TOTAL" = "0" ]; then
            echo '{"findings":[]}' > verified.json
          else
            printf '%s' "$VERIFIER_OUTPUT" | jq '.' > verified.json
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified
          path: verified.json
          retention-days: 1
      - name: Keep the transcript of a failed verifier
        if: failure() && steps.verifier.outputs.execution_file != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transcript-verify
          path: ${{ steps.verifier.outputs.execution_file }}
          retention-days: 1

  review:
    name: review
    needs: [route, lens, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          install: false
      # An unfinished panel uploads no findings, and the next step reports that, so a missing artifact is not an error here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: findings-*
          path: review/findings
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: verified
          path: review
      - name: Post the review and give the verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          PANEL_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/post-review.ts
