name: Bug
description: Something in Portolab does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe what you saw, with the exact message if there was one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The steps, the page address, and the device and browser you used.
    validations:
      required: true
