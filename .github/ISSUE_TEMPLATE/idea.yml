name: Idea
description: Something Portolab should do for a lecturer or a student.
labels: [idea]
body:
  - type: textarea
    id: situation
    attributes:
      label: The situation
      description: Who needs this, during which part of the course, and what they are trying to do.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: How they do it now, or why they cannot.
    validations:
      required: true
