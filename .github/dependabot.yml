# Without a commit-message setting, Dependabot takes the types and scopes of the history, such as chore(deps). It still writes "Bump" with a capital, so the check of titles and the merge both use the subject that scripts/parse-dependabot-title.ts writes from its title.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
