# Without a commit-message setting, Dependabot takes the types and scopes of the history, such as chore(deps). It still writes "Bump" with a capital, so the check of titles and the merge both use the subject that scripts/parse-dependabot-title.ts writes from its title.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Paraglide JS 3 needs a migration, which issue #81 describes and which waits until after the first release.
      - dependency-name: "@inlang/paraglide-js"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      # The build and the server of the Dockerfile run the same version of Node, because the build compiles better-sqlite3 for it.
      node:
        patterns: ["node"]
    ignore:
      # A new major version of Node changes the version that package.json requires, which Dependabot does not update with it.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
