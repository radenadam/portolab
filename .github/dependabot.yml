# Without a commit-message setting, Dependabot follows the Conventional Commits of the history, with a subject in lowercase, which the check of titles accepts. A prefix makes it write "Bump" with a capital, which that check rejects.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Paraglide JS 3 needs a migration, which issue #81 describes and which waits until after the first release.
      - dependency-name: "@inlang/paraglide-js"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
