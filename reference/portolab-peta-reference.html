<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portolab Peta Reference</title>
<!--
  Design reference for Portolab, direction "Peta" (alternative A of the redesign).
  Three desktop screens at 1320 px: Dosen / Kelas, Dosen / Mahasiswa, Mahasiswa / Beranda, each in light and dark.
  How to read this file:
  - Tokens for both themes are the two .dA[data-mode] rules. Layout and parts are the .a-* rules. Shared parts (chips, inline bars, chart marks) are the .m rules.
  - The script draws the screens from example data. riskMap() draws the risk and return map, lineChart() the portfolio line, dv()/ds()/br() the inline marks in table cells, and aKelas(), aMhs(), aBeranda() are the three screens.
  - All figures are example data. The fonts load from Google Fonts in this file only.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&display=swap">
<style>
/* Page around the mockups. Only the rules under .m and .dA below describe the Portolab screens. */
:root { --c-bg: #ECEEF1; --c-surface: #FFFFFF; --c-ink: #14171C; --c-ink2: #3A404A; --c-muted: #5B6370; --c-line: #D3D7DE; --c-accent: #2447C7; --c-tip: #14171C; --c-on-tip: #F4F5F7; }
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --c-bg: #0B0D10; --c-surface: #14171B; --c-ink: #E8EAEE; --c-ink2: #C3C8D0; --c-muted: #98A0AD; --c-line: #282D35; --c-accent: #9CB3FF; --c-tip: #E8EAEE; --c-on-tip: #14171C; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--c-bg); color: var(--c-ink); font: 15px/1.5 "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; border-radius: 6px; }
.bar { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; background: var(--c-bg); border-bottom: 1px solid var(--c-line); }
.bar-name { font-weight: 600; margin-right: auto; }
.bar-name span { font-weight: 400; color: var(--c-muted); }
.theme { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--c-muted); }
.toggle { display: inline-flex; border: 1px solid var(--c-line); border-radius: 999px; padding: 2px; background: var(--c-surface); }
.toggle button { font: inherit; font-size: 13px; color: var(--c-muted); background: transparent; border: 0; border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--c-ink); color: var(--c-bg); font-weight: 600; }
.frames { max-width: 1480px; margin: 0 auto; padding: 24px 16px 64px; display: flex; flex-direction: column; gap: 28px; }
.frame { margin: 0; border: 1px solid var(--c-line); border-radius: 14px; overflow: hidden; background: var(--c-surface); }
.frame-cap { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; padding: 10px 16px; border-bottom: 1px solid var(--c-line); font-size: 13.5px; color: var(--c-muted); }
.frame-cap .role { font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid var(--c-line); border-radius: 999px; padding: 1px 9px; color: var(--c-ink2); }
.frame-cap strong { color: var(--c-ink); font-weight: 600; }
.scaler { width: 100%; overflow-x: auto; overflow-y: hidden; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--c-tip); color: var(--c-on-tip); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; line-height: 1.4; max-width: 280px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28); }
.tip b { display: block; font-weight: 600; }

/* ===== Shared mockup base. Every mockup carries its own tokens through its direction class and data-mode, so it never depends on the viewer's theme. ===== */
.m { width: 1320px; zoom: var(--z, 1); background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.45; --plot: var(--panel); }
.m *, .m *::before, .m *::after { box-sizing: border-box; }
.m :where(h1, h2, h3, h4, p, figure, ul) { margin: 0; padding: 0; }
.m h1, .m h2, .m h3 { text-wrap: balance; }
.m ul { list-style: none; }
.m mark { background: none; color: inherit; }
.m .grow { flex: 1; }
.m .num { font-variant-numeric: tabular-nums; }
.m .ic { flex: none; }
.m .tri { width: 0.62em; height: 0.62em; flex: none; }
.m .dl { display: inline-flex; align-items: center; gap: 0.26em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.m .dl.up { color: var(--gain); }
.m .dl.dn { color: var(--loss); }
.m .dl.fl { color: var(--muted); }
.m .av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--raised); color: var(--ink2); flex: none; }
.m .chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); font-size: 12.5px; color: var(--ink2); white-space: nowrap; }
.m .chip b { font-family: var(--f-code); font-weight: 500; color: var(--ink); letter-spacing: 0.05em; }
.m .chip.sim { border-color: transparent; background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.m .chip.sim i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.m .seg { display: inline-flex; background: var(--raised); border-radius: 10px; padding: 3px; }
.m .seg span { padding: 6px 12px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--ink2); white-space: nowrap; }
.m .seg .on { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.14); }
.m .inp { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); font-size: 13px; background: var(--panel); min-width: 190px; }
.m .btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line2); font-weight: 600; font-size: 13px; color: var(--ink); white-space: nowrap; }
.m .btn.pri { background: var(--btn); color: var(--on-btn); border-color: transparent; }
.m .lk { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--link); white-space: nowrap; }
.m .cellbar { display: grid; grid-template-columns: 60px minmax(0, 1fr); gap: 8px; align-items: center; }
.m .cellbar .v { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.m .dv, .m .ds { position: relative; display: block; height: 14px; }
.m .dv::before, .m .ds::before { content: ""; position: absolute; left: 0; right: 0; top: 6.5px; height: 1px; background: var(--line); }
.m .dv .z { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line2); }
.m .dv .f { position: absolute; top: 3px; height: 8px; }
.m .dv .f.pos { background: var(--gain); border-radius: 0 3px 3px 0; }
.m .dv .f.neg { background: var(--loss); border-radius: 3px 0 0 3px; }
.m .dv .t, .m .ds .t { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--ink2); border-radius: 1px; }
.m .ds .d { position: absolute; top: 2px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--data); box-shadow: 0 0 0 2px var(--plot); }
.m .ds.me .d { background: var(--you); }
.m .br { position: relative; display: block; height: 8px; border-radius: 0 4px 4px 0; background: var(--raised); }
.m .br i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: var(--data); }
.m .unit { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 5px; }
.m .unit i { aspect-ratio: 1; border-radius: 50%; border: 1.75px solid var(--line2); }
.m .unit i.on { background: var(--unit, var(--data)); border-color: var(--unit, var(--data)); }
.m .segbar { display: flex; gap: 2px; height: 8px; }
.m .segbar i { border-radius: 4px; background: var(--data); }
.m .segbar i.cash { background: var(--line2); }
.m .key { display: inline-flex; align-items: center; gap: 6px; }
.m .key i { width: 14px; height: 2px; border-radius: 1px; background: var(--you); }
.m .key.ih i { background: var(--muted); }

.m .chart { display: block; width: 100%; height: auto; overflow: visible; }
.m svg text { font-family: var(--f-num); font-size: 10.5px; fill: var(--muted); }
.m svg .t-strong { fill: var(--ink); font-weight: 600; }
.m svg .t-lab { font-family: var(--f-ui); font-size: 12px; font-weight: 600; fill: var(--ink); }
.m svg .t-val { font-weight: 500; fill: var(--ink2); }
.m svg .t-sub { font-family: var(--f-ui); font-size: 11.5px; fill: var(--muted); }
.m svg .t-q { font-family: var(--f-ui); font-size: 11px; fill: var(--muted); }
.m svg .t-ses { font-family: var(--f-ui); font-size: 10.5px; font-weight: 600; fill: var(--muted); }
.m svg .halo { paint-order: stroke; stroke: var(--plot); stroke-width: 4px; stroke-linejoin: round; }
.m .g-line { stroke: var(--line); stroke-width: 1; }
.m .g-ref { stroke: var(--line2); stroke-width: 1; }
.m .g-ihsg { stroke: var(--ink2); stroke-width: 1.25; stroke-dasharray: 5 4; }
.m .g-med { stroke: var(--ink); stroke-width: 1.5; }
.m .p-on { fill: var(--data); stroke: var(--plot); stroke-width: 2; }
.m .p-off { fill: var(--plot); stroke: var(--data); stroke-width: 1.75; }
.m .p-dim { fill: var(--data); opacity: 0.32; }
.m .p-ghost { fill: var(--muted); opacity: 0.4; }
.m .p-sel { fill: var(--you); stroke: var(--plot); stroke-width: 2; }
.m .p-ring { fill: none; stroke: var(--you); stroke-width: 1.5; }
.m .p-bad { fill: var(--loss); stroke: var(--plot); stroke-width: 2; }
.m .p-ihsg { fill: var(--ink); stroke: var(--plot); stroke-width: 2; }
.m .p-hit { fill: transparent; }
.m .m-bar { fill: var(--data); opacity: 0.26; }
.m .l-port { fill: none; stroke: var(--you); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.m .l-ihsg { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.m .e-port { fill: var(--you); stroke: var(--plot); stroke-width: 2; }
.m .e-ihsg { fill: var(--muted); stroke: var(--plot); stroke-width: 2; }
.m .xh-l { stroke: var(--line2); stroke-width: 1; }
.m .w-col { fill: var(--data); }
.m .w-col.now { fill: var(--you); }
.m .spark { display: block; }
.m .spark path { fill: none; stroke-width: 1.5; stroke-linejoin: round; }
.m .spark.up path { stroke: var(--gain); }
.m .spark.dn path { stroke: var(--loss); }
.m .spark.up circle { fill: var(--gain); }
.m .spark.dn circle { fill: var(--loss); }

/* ===== A. Peta. One map of risk and return is the home of every screen. Cool charcoal, blue data, saffron for the selected point. ===== */
.dA { --f-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --f-num: "DM Mono", ui-monospace, Menlo, Consolas, monospace; --f-code: var(--f-num); }
.dA[data-mode="dark"] { --bg: #0F1317; --panel: #151B21; --raised: #1D252D; --line: #25303A; --line2: #3B4956; --ink: #E9EEF2; --ink2: #B9C4CE; --muted: #8695A3; --data: #3987E5; --data-soft: rgba(57, 135, 229, 0.18); --you: #C98500; --you-soft: rgba(201, 133, 0, 0.2); --gain: #3DCB8C; --loss: #FF7F6E; --gain-soft: rgba(61, 203, 140, 0.14); --loss-soft: rgba(255, 127, 110, 0.15); --warn: #E9B44C; --warn-soft: rgba(233, 180, 76, 0.14); --btn: #E9EEF2; --on-btn: #0F1317; --link: #7DB3F5; }
.dA[data-mode="light"] { --bg: #F1F4F7; --panel: #FFFFFF; --raised: #EEF2F5; --line: #DFE5EA; --line2: #B9C4CF; --ink: #0F1820; --ink2: #374552; --muted: #5D6B78; --data: #1F6FD6; --data-soft: rgba(31, 111, 214, 0.1); --you: #C97800; --you-soft: rgba(201, 120, 0, 0.14); --gain: #0B7A53; --loss: #C73A28; --gain-soft: #E1F3EB; --loss-soft: #FBE8E4; --warn: #8A5A00; --warn-soft: #FBF0D9; --btn: #0F1820; --on-btn: #FFFFFF; --link: #1A5FBA; }
.a-shell { display: grid; grid-template-columns: 76px minmax(0, 1fr); }
.a-rail { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 0; }
.a-logo { width: 36px; height: 36px; border-radius: 10px; background: var(--data); color: #FFFFFF; display: grid; place-items: center; margin-bottom: 16px; }
.a-nav { width: 62px; padding: 9px 0 7px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: var(--muted); }
.a-nav.on { background: var(--data-soft); color: var(--ink); font-weight: 600; }
.a-nav.on svg { color: var(--data); }
.a-body { min-width: 0; display: flex; flex-direction: column; }
.a-top { height: 58px; display: flex; align-items: center; gap: 10px; padding: 0 28px; border-bottom: 1px solid var(--line); }
.a-class { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
.a-class span { font-weight: 400; color: var(--muted); font-size: 13px; }
.a-main { padding: 26px 28px 30px; display: grid; gap: 20px; align-items: start; }
.a-k { grid-template-columns: minmax(0, 1fr) 344px; }
.a-col { display: grid; gap: 16px; min-width: 0; }
.a-head .eyebrow { font-size: 12.5px; color: var(--muted); }
.a-head h1 { font-size: 30px; line-height: 1.15; letter-spacing: -0.02em; font-weight: 600; margin-top: 6px; }
.a-head p { font-size: 15px; color: var(--ink2); margin-top: 8px; max-width: 70ch; }
.a-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.a-ph { display: flex; align-items: center; gap: 14px; padding: 14px 18px 0; }
.a-ph h2 { font-size: 15px; font-weight: 600; }
.a-ph2 { display: flex; align-items: center; gap: 14px; padding: 10px 18px 0; font-size: 12px; color: var(--muted); }
.a-legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink2); }
.a-legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.lg-on { width: 10px; height: 10px; border-radius: 50%; background: var(--data); }
.lg-off { width: 10px; height: 10px; border-radius: 50%; border: 1.75px solid var(--data); }
.lg-ihsg { width: 8px; height: 8px; background: var(--ink); transform: rotate(45deg); }
.lg-you { width: 10px; height: 10px; border-radius: 50%; background: var(--you); }
.lg-ghost { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: 0.5; }
.a-map { padding: 6px 10px 10px; }
.a-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.a-strip div { padding: 12px 18px; font-size: 12.5px; color: var(--muted); }
.a-strip div + div { border-left: 1px solid var(--line); }
.a-strip b { display: block; font-size: 20px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
.a-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; min-width: 0; }
.a-card h3 { font-size: 13px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.a-card h3 em { font-style: normal; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--data-soft); color: var(--ink); }
.a-flag { display: grid; grid-template-columns: 24px minmax(0, 1fr) 16px; gap: 10px; padding: 10px 0; align-items: start; color: var(--muted); }
.a-flag + .a-flag { border-top: 1px solid var(--line); }
.a-flag .st { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; }
.a-flag .st.bad { background: var(--loss-soft); color: var(--loss); }
.a-flag .st.idle { background: var(--warn-soft); color: var(--warn); }
.a-flag b { font-weight: 600; color: var(--ink); display: block; }
.a-flag p { font-size: 12.5px; color: var(--muted); }
.a-ask { display: grid; gap: 10px; font-size: 13.5px; color: var(--ink2); }
.a-ask li { padding-left: 14px; position: relative; }
.a-ask li::before { content: ""; position: absolute; left: 0; top: 0.6em; width: 5px; height: 5px; border-radius: 50%; background: var(--data); }
.a-feed { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 9px 0; }
.a-feed + .a-feed { border-top: 1px solid var(--line); }
.a-feed .av { width: 28px; height: 28px; font-size: 11px; }
.a-feed b { font-weight: 600; }
.a-feed small { font-size: 12px; color: var(--muted); margin-left: 6px; }
.a-feed p { font-size: 13px; color: var(--ink2); margin-top: 1px; }
.a-s { grid-template-columns: minmax(0, 1fr) 332px; }
.a-tools { display: flex; align-items: center; gap: 10px; }
.a-tools h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin-right: 8px; }
.a-filters { display: flex; gap: 8px; }
.a-filters .chip.on { background: var(--btn); color: var(--on-btn); border-color: transparent; font-weight: 600; }
.a-tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.a-tbl th { font-size: 11.5px; font-weight: 600; color: var(--muted); text-align: left; padding: 13px 10px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.a-tbl th.srt { color: var(--ink); }
.a-tbl td { padding: 0 10px; height: 50px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.a-tbl tbody tr:last-child td { border-bottom: 0; }
.a-tbl tr.sel td { background: var(--you-soft); --plot: transparent; --muted: var(--ink2); }
.dA[data-mode="light"] .a-tbl tr.sel td { --loss: #B02E1E; --gain: #096B49; }
.a-tbl .rk { font-family: var(--f-num); font-size: 12px; color: var(--muted); text-align: right; width: 30px; padding-right: 2px; }
.a-who { display: flex; align-items: center; gap: 8px; min-width: 0; }
.a-who .av { width: 30px; height: 30px; }
.a-who b { font-weight: 600; display: block; white-space: nowrap; }
.a-who small { font-family: var(--f-num); font-size: 11px; color: var(--muted); }
.a-last { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink2); white-space: nowrap; }
.a-last i { width: 7px; height: 7px; border-radius: 50%; background: var(--line2); }
.a-last.on i { background: var(--gain); }
.a-tnote { padding: 10px 18px 14px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); display: flex; gap: 18px; }
.a-tnote span { display: inline-flex; align-items: center; gap: 7px; }
.a-tnote i { width: 2px; height: 12px; border-radius: 1px; background: var(--ink2); }
.a-insp { display: grid; gap: 14px; }
.a-insp-head { display: flex; align-items: center; gap: 12px; }
.a-insp-head .av { width: 44px; height: 44px; font-size: 15px; background: var(--you-soft); color: var(--ink); }
.a-insp-head b { font-size: 17px; font-weight: 600; display: block; }
.a-insp-head small { font-size: 12px; color: var(--muted); }
.a-kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 10px; }
.a-kv div { font-size: 11.5px; color: var(--muted); }
.a-kv b { display: block; font-size: 16px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.a-note { font-size: 13px; color: var(--ink2); background: var(--raised); border-radius: 10px; padding: 10px 12px; }
.a-note b { font-weight: 600; color: var(--ink); }
.a-hold { display: grid; gap: 7px; font-size: 12.5px; color: var(--ink2); }
.a-hold span b { font-family: var(--f-num); font-weight: 500; color: var(--ink); }
.a-acts { display: flex; gap: 8px; }
.a-h { grid-template-columns: 372px minmax(0, 1fr); }
.a-wide { grid-column: 1 / -1; }
.a-hero .lab { font-size: 13px; color: var(--muted); }
.a-hero .val { font-size: 44px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.05; margin-top: 4px; }
.a-hero .val small { font-size: 22px; font-weight: 500; color: var(--muted); margin-right: 6px; letter-spacing: 0; }
.a-today { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 13px; color: var(--muted); }
.a-today .dl { padding: 3px 8px; border-radius: 7px; background: var(--gain-soft); font-weight: 600; }
.a-vs { display: grid; gap: 4px; }
.a-vs .big { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.a-vs .keys { display: flex; gap: 14px; font-size: 12px; color: var(--ink2); margin: 6px 0 2px; }

      '<div class="a-risk"><span>Sharpe</span><b>' + nf(ME.sharpe, 2) + '</b>' + ds(ME.sharpe, 0, 0.105, 0.07, 'me') + '<small>IHSG 0,07. Imbal hasil per unit risiko masih di bawah pasar.</small></div></section></div>' +
      '<div class="a-col"><section class="a-panel"><div class="a-ph"><h2>Posisi Anda di peta</h2><span class="grow"></span><div class="seg"><span class="on">Peta</span><span>Grafik waktu</span></div></div>' +
      '<div class="a-ph2"><div class="a-legend"><span><i class="lg-you"></i>Portofolio Anda</span><span><i class="lg-on"></i>Saham Anda, ukuran = bobot</span><span><i class="lg-ihsg"></i>IHSG</span><span><i class="lg-ghost"></i>Teman sekelas</span></div></div><div class="a-ph2" style="padding-top:6px">Tegak: imbal hasil. Saham dihitung sejak dibeli, portofolio sejak 14 Okt.</div>' +
      '<div class="a-map">' + map + '</div>' +
      '<div class="a-insight"><em>Sesi 9 · Beta</em><span>ANTM memberi imbal hasil tertinggi dan juga beta tertinggi (1,46). Kas ' + pc(ME.cashW, 0) + ' menarik beta portofolio turun ke ' + nf(ME.beta, 2) + '.</span><span class="lk">Pelajari' + ic('arrow', 15) + '</span></div></section></div>' +
      '<section class="a-panel a-wide"><table class="a-ht"><thead><tr><th>Saham Anda · 5</th><th style="text-align:left">Bobot</th><th>Lot</th><th>Harga rata-rata</th><th>Harga</th><th>Nilai</th><th style="text-align:left">Laba atau rugi</th><th style="text-align:left">1 bulan</th></tr></thead><tbody>' + rows +
      '<tr><td class="tk"><b>Kas</b><small>Rp 5,1 jt disisihkan untuk order</small></td><td class="wide"><div class="cellbar"><span class="v">' + pc(ME.cashW, 1) + '</span>' + br(ME.cashW, 30) + '</div></td><td></td><td></td><td></td><td>' + rp(ME.cash) + '</td><td></td><td></td></tr></tbody></table></section></main>');
  }

  /* ---------- Assemble ---------- */
  function effectiveTheme() {
    var a = document.documentElement.getAttribute('data-theme');
    if (a === 'dark' || a === 'light') return a;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  var mode = effectiveTheme();
  var overridden = false;

  var SCREENS = {
    A: [['Dosen', 'Kelas', 'The map replaces both histograms. The join code moves to the top bar.', aKelas],
      ['Dosen', 'Mahasiswa', 'Same columns as today. Return and beta are also drawn on shared scales. The selected student shows on the map.', aMhs],
      ['Mahasiswa', 'Beranda', 'The student sees their stocks, their portfolio and the IHSG on one map.', aBeranda]]
  };
  Object.keys(SCREENS).forEach(function (d) {
    var host = document.querySelector('.frames[data-dir="' + d + '"]');
    host.innerHTML = SCREENS[d].map(function (s) {
      return '<figure class="frame"><figcaption class="frame-cap"><span class="role">' + s[0] + '</span><strong>' + s[1] + '</strong><span>' + s[2] + '</span></figcaption><div class="scaler"><div class="m d' + d + '" data-mode="' + mode + '">' + s[3]() + '</div></div></figure>';
    }).join('');
  });

  function applyMode() {
    document.querySelectorAll('.m').forEach(function (m) { m.setAttribute('data-mode', mode); });
    document.getElementById('mode-light').setAttribute('aria-pressed', String(mode === 'light'));
    document.getElementById('mode-dark').setAttribute('aria-pressed', String(mode === 'dark'));
  }
  applyMode();
  document.querySelectorAll('.toggle button').forEach(function (b) {
    b.addEventListener('click', function () { mode = b.getAttribute('data-set'); overridden = true; applyMode(); });
  });
  function follow() { if (!overridden) { mode = effectiveTheme(); applyMode(); } }
  new MutationObserver(follow).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', follow);
  }

  /* Scale every 1320px mockup to its frame. */
  function fit(sc) {
    var w = sc.clientWidth;
    if (!w) return;
    var z = Math.max(0.5, Math.min(1.12, Math.floor(w / 1320 * 1000) / 1000));
    sc.firstElementChild.style.setProperty('--z', z);
  }
  var scalers = document.querySelectorAll('.scaler');
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(function (es) { es.forEach(function (e) { fit(e.target); }); });
    scalers.forEach(function (sc) { ro.observe(sc); });
  }
  scalers.forEach(fit);
  window.addEventListener('resize', function () { scalers.forEach(fit); });

  /* Tooltips */
  var tip = document.getElementById('tip');
  function showTip(e, lines) {
    tip.innerHTML = '<b>' + lines[0] + '</b>' + lines.slice(1).join('<br>');
    tip.hidden = false;
    var r = tip.getBoundingClientRect(), x = e.clientX + 14, y = e.clientY + 16;
    if (x + r.width > window.innerWidth - 8) x = e.clientX - r.width - 12;
    if (y + r.height > window.innerHeight - 8) y = e.clientY - r.height - 12;
    tip.style.left = Math.max(8, x) + 'px';
    tip.style.top = Math.max(8, y) + 'px';
  }
  document.addEventListener('pointermove', function (e) {
    var t = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (t) showTip(e, t.getAttribute('data-tip').split('|'));
    else if (!(e.target.closest && e.target.closest('svg.lc'))) tip.hidden = true;
  });
  document.querySelectorAll('svg.lc').forEach(function (svg) {
    var c = LC[svg.getAttribute('data-lc')], g = svg.querySelector('.xh'), ln = g.querySelector('line'), cs = g.querySelectorAll('circle');
    function Y(v) { return c.p.t + (c.hi - v) / (c.hi - c.lo) * (c.H - c.p.t - c.p.b); }
    svg.addEventListener('pointermove', function (e) {
      var r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * c.W, span = c.W - c.p.l - c.p.r;
      var i = Math.max(0, Math.min(c.n - 1, Math.round((x - c.p.l) / span * (c.n - 1)))), X = c.p.l + i / (c.n - 1) * span;
      ln.setAttribute('x1', X); ln.setAttribute('x2', X);
      cs[0].setAttribute('cx', X); cs[0].setAttribute('cy', Y(IHSG[i]));
      cs[1].setAttribute('cx', X); cs[1].setAttribute('cy', Y(PORT[i]));
      g.setAttribute('visibility', 'visible');
      showTip(e, [DATES[i] + ' 2026', 'Portofolio ' + spc(PORT[i]), 'IHSG ' + spc(IHSG[i])]);
    });
    svg.addEventListener('pointerleave', function () { g.setAttribute('visibility', 'hidden'); tip.hidden = true; });
  });
})();
</script>
