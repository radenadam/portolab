pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,json,md,yml,yaml,css}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{ts,tsx}"
      run: pnpm exec eslint --max-warnings=0 --fix {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commit message
      run: pnpm exec commitlint --edit {1}
